<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Orbit Fitness - Recuperação de Senha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <!-- Topo com seta e título -->
        <div class="topo">
            <a href="login.html" class="seta-voltar">←</a>
            <h2>RECUPERAÇÃO DE SENHA</h2>
        </div>


        <!-- Título e descrição -->
        <h1>Esqueceu sua senha?</h1>
        <p>Não se preocupe! Insira o e-mail cadastrado abaixo e enviaremos um link seguro com as instruções para redefinir sua senha.</p>

        <!-- Formulário -->
        <form>
            <label for="email">E-mail cadastrado</label>
            <div class="input-box">
                <span class="icon-email">✉</span>
                <input type="email" id="email" placeholder="seu.nome@exemplo.com" required>
            </div>

            <button type="submit">ENVIAR LINK DE REDEFINIÇÃO</button>
        </form>

        <!-- Link inferior -->
        <div class="voltar-login">
            <a href="login.html">← VOLTAR PARA O LOGIN</a>
        </div>
    </div>

</body>
</html>
